name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    # Known-vulnerability scan of the locked dependency trees (SCA). This gate
    # blocks: the backlog it was provisionally exempted for is cleared (see
    # .agent-team/plans/dependency-audit-backlog_f203f7.html), so a new
    # advisory at high or above now fails the run instead of adding another
    # red cross nobody reads.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Both scans always run: a finding in one must not hide the other half of
      # the tree. Each records its outcome and the gate below re-raises it, so
      # the job still turns red when either scan finds something.
      - name: npm audit (high and above)
        id: npm-audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: pip-audit (backend lock)
        id: pip-audit
        continue-on-error: true
        run: |
          uv --project backend export --format requirements-txt --no-hashes --no-emit-project > /tmp/backend-requirements.txt
          uv --project backend run --with pip-audit pip-audit -r /tmp/backend-requirements.txt
      - name: Audit gate
        env:
          NPM_AUDIT: ${{ steps.npm-audit.outcome }}
          PIP_AUDIT: ${{ steps.pip-audit.outcome }}
        run: |
          echo "npm audit:  $NPM_AUDIT"
          echo "pip-audit:  $PIP_AUDIT"
          if [ "$NPM_AUDIT" != success ] || [ "$PIP_AUDIT" != success ]; then
            exit 1
          fi

  frontend:
    name: Frontend checks and build (macOS)
    # Keep the desktop checks on the release platform.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: frontend

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv --project backend sync --locked

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:run

      - name: Build application and bundled plugins
        # The mini-IDE bundle (Monaco in one rollup graph) peaks above the
        # runner's ~2GB default V8 heap and aborts with exit 134. Same cap the
        # release build already uses.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm build

  frontend-linux:
    name: Frontend checks and build (Linux)
    # Same gates as the macOS job, run where process.platform is "linux": the
    # window controls, external terminal, login-shell PATH and menu code all
    # branch on the platform, and vitest only exercises the Linux branches
    # when the host actually is Linux. Ubuntu 22.04 to match backend-linux.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: frontend-linux

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv --project backend sync --locked

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:run

      - name: Build application and bundled plugins
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm build

  frontend-windows:
    name: Frontend checks and build (Windows)
    # The same typecheck / vitest / build as the macOS and Linux jobs, run
    # where process.platform is "win32".
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: frontend-windows

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv --project backend sync --locked

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:run

      - name: Build application and bundled plugins
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm build

  backend:
    name: Backend checks (macOS)
    # Backend tests exercise macOS PTY/zsh behavior.
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend

      - name: Install dependencies
        run: uv --project backend sync --locked

      - name: Lint backend (event-loop guardrail)
        run: uv --project backend run --locked ruff check backend

      - name: Backend tests
        run: uv --project backend run --locked pytest backend/tests

  backend-linux:
    name: Backend checks (Linux)
    # The macOS job above is the release platform; this one is what stops the
    # Linux port from rotting between releases. Ubuntu 22.04 rather than
    # latest, because PyInstaller links against the build machine's glibc and
    # the oldest runner we support sets the floor for everyone.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend-linux

      - name: Install dependencies
        run: uv --project backend sync --locked

      - name: Lint backend (event-loop guardrail)
        run: uv --project backend run --locked ruff check backend

      - name: Backend tests
        run: uv --project backend run --locked pytest backend/tests

      # The suite runs without a terminal, so it never proves the app can open
      # one. This does: a real PTY, a real /proc read, and a real /health.
      - name: Linux runtime smoke test
        run: uv --project backend run --locked python backend/linux_smoke.py

  backend-windows:
    name: Backend checks (Windows)
    # Same suite as the macOS and Linux jobs, where os.name is "nt". Import
    # first: until the POSIX-only modules sit behind osplat the app does not
    # even load here, and that is a clearer signal than a wall of collection
    # errors. pytest-timeout is the guard against a test that waits on a
    # POSIX-only thing forever; the runner has no SIGALRM, so the thread
    # method, which ends the whole run at the first timeout.
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend-windows

      - name: Install dependencies
        run: uv --project backend sync --locked

      - name: Lint backend
        run: uv --project backend run --locked ruff check backend

      - name: Backend imports on Windows
        run: uv --project backend run --locked python -c "import agent_team_backend.app"

      - name: Backend tests
        run: uv --project backend run --locked pytest backend/tests --timeout=90 --timeout-method=thread -o faulthandler_timeout=120

  plans:
    name: Packaged Plans checks (macOS)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: plans

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv --project backend sync --locked

      - name: Packaged Plans integration gate
        run: pnpm run test:packaged-plans

      - name: Verify production Plans bundle excludes fixture
        run: |
          pnpm run build:plans
          node scripts/verify-plans-production.mjs

  registry:
    name: Marketplace registry and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: marketplace/registry/uv.lock
          cache-suffix: registry

      - name: Install dependencies
        run: uv --project marketplace/registry sync --locked

      - name: Lint marketplace registry
        run: uv --project marketplace/registry run --locked ruff check marketplace/registry/registry marketplace/registry/tests

      - name: Marketplace registry tests
        run: uv --project marketplace/registry run --locked pytest marketplace/registry/tests

      - name: Plugin contract fixtures
        run: uv --project marketplace/registry run --locked python docs/plugin-contracts/validate-fixtures.py

  lint-and-test:
    # Preserve the existing required-check name for branch protection.
    name: Lint and test
    if: ${{ always() }}
    needs: [frontend, frontend-linux, frontend-windows, backend, backend-linux, backend-windows, plans, registry, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_LINUX_RESULT: ${{ needs['frontend-linux'].result }}
          FRONTEND_WINDOWS_RESULT: ${{ needs['frontend-windows'].result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_LINUX_RESULT: ${{ needs['backend-linux'].result }}
          BACKEND_WINDOWS_RESULT: ${{ needs['backend-windows'].result }}
          PLANS_RESULT: ${{ needs.plans.result }}
          REGISTRY_RESULT: ${{ needs.registry.result }}
          AUDIT_RESULT: ${{ needs['dependency-audit'].result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$FRONTEND_LINUX_RESULT" = success
          test "$FRONTEND_WINDOWS_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$BACKEND_LINUX_RESULT" = success
          test "$BACKEND_WINDOWS_RESULT" = success
          test "$PLANS_RESULT" = success
          test "$REGISTRY_RESULT" = success
          test "$AUDIT_RESULT" = success
